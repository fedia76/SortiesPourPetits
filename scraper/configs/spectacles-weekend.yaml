# Exemple de configuration : les spectacles du week-end qui vient.
# Toutes les clés sauf `name` et `theme` ont une valeur par défaut ;
# `python -m sortiesbot --config ce-fichier.yaml` suffit à lancer un dry-run.

name: spectacles-weekend
theme: >-
  des spectacles, théâtres et contes pour enfants (0 à 12 ans) programmés
  ce week-end

area: Île-de-France
period: le week-end qui vient
horizon_days: 7

# Nombre maximum de sorties retenues par run.
max_events: 20

# Recherches web (0,01 $ pièce). Les pages d'agenda, elles, sont téléchargées
# en Python : elles ne coûtent rien, d'où un plafond confortable.
max_searches: 6
max_agendas: 6
max_links_per_agenda: 8
# Caractères de page transmis au modèle pour remplir une fiche de sortie.
max_page_chars: 8000
# Plafond de coût du run, vérifié avant chaque appel payant.
max_cost_usd: 1.00

# Catégorie utilisée quand aucune catégorie du site ne correspond.
default_category: Non classé

# Un géocodage hors de ces départements est traité comme un échec.
postal_prefixes: ["75", "77", "78", "91", "92", "93", "94", "95"]

# Domaines écartés d'office (pages illisibles ou sans contenu exploitable).
blocked_domains:
  - facebook.com
  - instagram.com
  - x.com
  - twitter.com
  - tiktok.com
  - youtube.com
  - pinterest.fr

provider: anthropic
# Les trois appels sont bornés — chercher, trier des liens, remplir une fiche.
# Aucun ne demande de dérouler une procédure, donc Haiku suffit partout.
search_model: claude-haiku-4-5
select_model: claude-haiku-4-5
extraction_model: claude-haiku-4-5

# Pour personnaliser les prompts, décommentez et modifiez. Les variables
# disponibles sont listées dans sortiesbot/prompts.py.
#
# search_prompt: |
#   Lance $max_searches recherches ...
#
# select_prompt: |
#   Voici les liens de $page ... $links
#
# extraction_prompt: |
#   Voici le contenu de $url : $content
