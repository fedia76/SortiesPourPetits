# Exemple de configuration : les spectacles du week-end qui vient.
# Toutes les clés sauf `name` et `theme` ont une valeur par défaut ;
# `python -m sortiesbot --config ce-fichier.yaml` suffit à lancer un dry-run.

name: spectacles-weekend
theme: >-
  des spectacles, théâtres et contes pour enfants (0 à 12 ans) programmés
  ce week-end

area: Île-de-France
period: le week-end qui vient
horizon_days: 7

# Nombre maximum de sorties retenues par run.
max_events: 20

# Plafonds de coût. Pendant un tour, la boucle serveur refacture en entrée
# tout le contexte accumulé à chacune de ses itérations : chaque page lue est
# donc payée plusieurs fois. C'est max_page_tokens qui pèse le plus lourd.
max_searches: 6
max_fetches: 5
max_page_tokens: 5000
# Le run s'arrête s'il dépasse ce coût en jetons (dollars).
max_cost_usd: 0.50

# Catégorie utilisée quand aucune catégorie du site ne correspond.
default_category: Non classé

# Un géocodage hors de ces départements est traité comme un échec.
postal_prefixes: ["75", "77", "78", "91", "92", "93", "94", "95"]

# Domaines écartés d'office (pages illisibles ou sans contenu exploitable).
blocked_domains:
  - facebook.com
  - instagram.com
  - x.com
  - twitter.com
  - tiktok.com
  - youtube.com
  - pinterest.fr

provider: anthropic
# Haiku pour les deux étages : le moins cher, et suffisant pour « chercher
# large puis repérer les pages qui décrivent une sortie précise ». Passer la
# découverte sur claude-sonnet-5 ou claude-opus-5 si la qualité déçoit —
# ce sont les seuls à savoir filtrer les résultats avant de les mettre en
# contexte, ce qui compense une partie de leur prix au jeton.
discovery_model: claude-haiku-4-5
extraction_model: claude-haiku-4-5

# Pour personnaliser les prompts, décommentez et modifiez. Les variables
# disponibles sont listées dans sortiesbot/prompts.py.
#
# discovery_prompt: |
#   Tu cherches ...
#   Recherche demandée : $theme
#   Zone : $area — période : $period (du $date_from au $date_to)
#
# extraction_prompt: |
#   Lis la page $url et ...
