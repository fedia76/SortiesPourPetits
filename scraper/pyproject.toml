[project]
name = "sortiesbot"
version = "0.1.0"
description = "Recherche automatique de sorties pour SortiesPourPetits"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0,<2",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sortiesbot", "sortiesbot.providers", "sortiesbot.stages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
