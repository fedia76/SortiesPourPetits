name: Vérification

# Le déploiement compile le front, donc il typecheck — mais seulement sur
# `main`, et donc seulement une fois qu'il est trop tard : une erreur de type
# y casse la mise en production au lieu de casser une branche. Et les tests du
# scraper, eux, ne tournaient nulle part.
#
# `main` était ignoré ici, ce qui laissait un trou : un commit poussé
# directement sur la branche par défaut ne rencontrait aucune vérification et
# partait en production tel quel. Ce workflow tourne donc partout, `main`
# compris — le déploiement, lui, reste déclenché séparément.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scraper:
    name: Tests du scraper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer
        working-directory: scraper
        run: pip install -e ".[dev]"
      # Avant les tests : une variable morte ou un import fantôme se voit en
      # deux secondes, là où la suite en met vingt. Le dépôt portait une
      # dizaine de « # noqa: BLE001 » — des suppressions écrites pour un
      # linter qui ne tournait nulle part.
      - name: Lint du scraper
        working-directory: scraper
        run: ruff check .
      - name: Tests
        working-directory: scraper
        run: python -m pytest -q

  front:
    name: Types et compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Types et lint du front
        working-directory: client
        run: |
          npm ci
          npm run typecheck
          npm run lint
      # `build` compile `src`, et rien d'autre : ni les tests, ni `scripts/`. Le
      # script de reprise des étiquettes a pu écrire dans une table supprimée
      # pendant des semaines pour cette raison exacte, sans que rien ne le dise.
      # `typecheck` couvre les trois.
      - name: Compilation et types de l'API
        working-directory: server
        run: |
          npm ci
          npm run build
          npm run typecheck
      # Ce que la compilation ne voit pas : un `await` oublié dans une route,
      # une promesse qui part sans personne pour la rattraper. C'est de la même
      # famille que ce qui a éteint le site public une fois déjà (voir
      # `lib/asyncRoutes`).
      - name: Lint de l'API
        working-directory: server
        run: npm run lint
      # La mesure du banc est du calcul pur, et une erreur y fausserait tous les
      # chiffres sans rien casser : compiler ne suffit donc pas à la surveiller.
      # Ces tests ne demandent aucune dépendance de plus — le lanceur de Node,
      # chargé par `tsx`, que l'API a déjà.
      #
      # Le motif de `npm test` n'est **pas** protégé par des guillemets, et il ne
      # doit pas l'être : c'est le shell qui doit le développer. Le lanceur de
      # Node 20 ne développe pas les motifs lui-même et cherche un fichier
      # nommé « tests/*.test.ts », qu'il ne trouve évidemment pas.
      - name: Tests de l'API
        working-directory: server
        run: npm test

  # Ce job-ci appelle le vrai service et consomme un crédit : il ne part jamais
  # tout seul. Deux façons de le demander, et la seconde existe parce que la
  # première ne suffit pas — GitHub n'affiche le bouton « Run workflow » que
  # pour les workflows présents sur la branche par défaut. Tant que ce fichier
  # vit sur une branche de travail, `workflow_dispatch` est hors d'atteinte.
  #
  #   · « [serper] » dans le message d'un commit : marche depuis n'importe
  #     quelle branche, aujourd'hui ;
  #   · le bouton « Run workflow » : une fois ce fichier fusionné dans `main`.
  serper:
    name: Forme réelle des réponses Serper (sur demande)
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[serper]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifier la clé
        env:
          SERPER_API_KEY: ${{ secrets.SERPER }}
        # Un secret absent donnerait un « 403 » qu'on mettrait dix minutes à
        # relier au bon endroit. Autant le dire tout de suite.
        run: |
          if [ -z "$SERPER_API_KEY" ]; then
            echo "::error::Le secret SERPER est vide ou absent des secrets du dépôt."
            exit 1
          fi
          echo "Clé présente (${#SERPER_API_KEY} caractères)."
      - name: Installer
        working-directory: scraper
        run: pip install -e .
      - name: Interroger Serper
        working-directory: scraper
        env:
          SERPER_API_KEY: ${{ secrets.SERPER }}
        run: python -m tools.serper_shape "spectacle jeune public Paris septembre"
