name: Déploiement

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build API
        working-directory: server
        run: |
          npm ci
          npm run build

      - name: Build front
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Préparer la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Ajouter le VPS aux hôtes connus
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # rsync par dossier (pas de source multiple + --delete : ça supprimerait
      # aussi .env et node_modules, qui ne viennent pas du dépôt).
      - name: Déployer le code compilé de l'API
        run: |
          rsync -az --delete server/dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/server/dist/"
          rsync -az --delete server/prisma/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/server/prisma/"
          rsync -az server/package.json server/package-lock.json \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/server/"

      - name: Déployer le front
        run: |
          rsync -az --delete client/dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/client/"

      - name: Installer les dépendances et migrer la base
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            set -e
            cd '${{ secrets.VPS_APP_DIR }}/server'
            npm ci --omit=dev
            npm run db:deploy
          "

      - name: Redémarrer l'API
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo systemctl restart sortiespourpetits-api'

      # Le scraper vient en dernier, après le redémarrage de l'API : un
      # problème de son côté ne doit jamais empêcher le site d'être livré.
      # Il part en sources (c'est du Python) : tout le dossier, sauf ce qui
      # appartient au VPS — l'environnement virtuel, les secrets, les journaux
      # de run et la mémoire des URLs déjà vues.
      - name: Déployer le scraper
        run: |
          rsync -az --delete \
            --exclude '.venv/' \
            --exclude '.env' \
            --exclude 'runs/' \
            --exclude 'state/' \
            --exclude '__pycache__/' \
            --exclude '*.egg-info/' \
            scraper/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/scraper/"

      # Le fichier .env du scraper est régénéré à chaque déploiement : il se
      # modifie dans les secrets GitHub, jamais sur le VPS. Il passe par
      # l'entrée standard de ssh pour ne pas apparaître dans la liste des
      # processus du VPS, et `umask 077` le crée illisible par les autres.
      - name: Configurer le scraper
        env:
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
          SPP_API_KEY: ${{ secrets.SPP_API_KEY }}
        run: |
          printf '%s\n' \
            "ANTHROPIC_API_KEY=$CLAUDE_KEY" \
            "SPP_API_URL=http://localhost:3000" \
            "SPP_API_KEY=$SPP_API_KEY" \
          | ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "umask 077 && cat > '${{ secrets.VPS_APP_DIR }}/scraper/.env'"

          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            set -e
            cd '${{ secrets.VPS_APP_DIR }}/scraper'
            python3 -m venv .venv || {
              echo 'Le module venv de Python manque sur le VPS. En root :'
              echo '    apt install -y python3-venv'
              echo '(ou le paquet versionné que le message ci-dessus indique,'
              echo ' par exemple python3.14-venv)'
              exit 1
            }
            .venv/bin/pip install --quiet --upgrade pip
            .venv/bin/pip install --quiet -e .
          "

      # Le worker exécute les recherches lancées depuis la console
      # d'administration. Tant qu'il n'est pas installé (voir deploy/README.md
      # § 9), le site reste livré : les exécutions attendent simplement en file.
      - name: Redémarrer le worker du scraper
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo systemctl restart sortiespourpetits-scraper' \
            || echo 'Worker non installé sur le VPS — voir deploy/README.md § 9.'
