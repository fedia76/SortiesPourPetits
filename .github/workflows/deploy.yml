name: Déploiement

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build API
        working-directory: server
        run: |
          npm ci
          npm run build

      - name: Build front
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Préparer la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Ajouter le VPS aux hôtes connus
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # rsync par dossier (pas de source multiple + --delete : ça supprimerait
      # aussi .env et node_modules, qui ne viennent pas du dépôt).
      - name: Déployer le code compilé de l'API
        run: |
          rsync -az --delete server/dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/server/dist/"
          rsync -az --delete server/prisma/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/server/prisma/"
          # Les scripts d'exploitation : reprises de données, outillage. Ils ne
          # sont pas compilés dans `dist/` et ne partaient donc pas — un
          # `npm run` qui les vise échouait sur un fichier absent du VPS.
          rsync -az --delete server/scripts/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/server/scripts/"
          # Et les sources, parce que ces scripts-là en importent : ils
          # réutilisent les fonctions de `src/lib/` plutôt que d'en recopier
          # une deuxième version qui dériverait. Envoyer `scripts/` sans
          # `src/` ne corrigeait donc qu'une moitié de la panne — le fichier
          # était bien là, et mourait sur `Cannot find module '../src/lib/…'`.
          # Les viser dans `dist/` aurait cassé leur exécution en local, où
          # rien n'est compilé ; c'est la source qui voyage.
          rsync -az --delete server/src/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/server/src/"
          rsync -az server/package.json server/package-lock.json \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/server/"

      - name: Déployer le front
        run: |
          rsync -az --delete client/dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/client/"

      - name: Installer les dépendances et migrer la base
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            set -e
            cd '${{ secrets.VPS_APP_DIR }}/server'
            npm ci --omit=dev
            npm run db:deploy
          "

      # Juste après la migration, et avant tout le reste : le code sur le
      # disque et le schéma en base viennent de changer ensemble, et le
      # processus qui tourne encore connaît l'ancien des deux.
      - name: Redémarrer l'API
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo systemctl restart sortiespourpetits-api'

      # Les reprises de données viennent **après** le redémarrage, et ne
      # peuvent pas faire échouer le déploiement.
      #
      # Elles étaient avant, et sous `set -e` : la reprise des étiquettes du
      # banc a buté sur un fichier que le déploiement ne copiait pas, l'étape
      # est tombée, et le redémarrage de l'API n'a jamais eu lieu. Le site est
      # resté sur l'ancien code face à un schéma qui venait de changer — une
      # panne bien plus grave que le confort qu'on cherchait à installer.
      #
      # Une reprise ratée se rejoue à la main ; un site à moitié déployé, non.
      - name: Reprendre les données (sans bloquer le déploiement)
        continue-on-error: true
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            cd '${{ secrets.VPS_APP_DIR }}/server'
            # Étiquettes de l'ancien banc d'extraction vers le corpus.
            # Idempotente : elle ne fait rien une fois passée.
            npm run db:backfill-eval || echo 'Reprise des étiquettes à rejouer à la main.'
          "

      # Le scraper vient en dernier, après le redémarrage de l'API : un
      # problème de son côté ne doit jamais empêcher le site d'être livré.
      # Il part en sources (c'est du Python) : tout le dossier, sauf ce qui
      # appartient au VPS — l'environnement virtuel, les secrets, les journaux
      # de run et la mémoire des URLs déjà vues.
      - name: Déployer le scraper
        run: |
          rsync -az --delete \
            --exclude '.venv/' \
            --exclude '.env' \
            --exclude 'runs/' \
            --exclude 'state/' \
            --exclude '__pycache__/' \
            --exclude '*.egg-info/' \
            scraper/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/scraper/"

      # Les fichiers de configuration système (unités systemd, Caddyfile) ne
      # peuvent pas être installés par le déploiement : `deploy` n'est pas
      # root. Ils sont simplement déposés à jour sur le VPS, prêts à être
      # copiés à la main — voir deploy/README.md § 6 et § 9.
      - name: Déposer les fichiers de configuration système
        run: |
          # `umami/.env` porte les secrets de la pile de mesure d'audience. Il
          # est créé une fois sur le VPS et n'existe pas dans le dépôt : sans
          # cette exclusion, le `--delete` l'emporterait à chaque mise en ligne
          # et `docker compose` ne saurait plus démarrer. Même raison que pour
          # le `.env` du scraper, qui est exclu de son propre rsync.
          rsync -az --delete --exclude 'umami/.env' deploy/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/deploy/"

      # Le fichier .env du scraper est régénéré à chaque déploiement : il se
      # modifie dans les secrets GitHub, jamais sur le VPS. Il passe par
      # l'entrée standard de ssh pour ne pas apparaître dans la liste des
      # processus du VPS, et `umask 077` le crée illisible par les autres.
      - name: Configurer le scraper
        env:
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
          SPP_API_KEY: ${{ secrets.SPP_API_KEY }}
          SERPER: ${{ secrets.SERPER }}
          OPENROUTER: ${{ secrets.OPENROUTER }}
        run: |
          printf '%s\n' \
            "ANTHROPIC_API_KEY=$CLAUDE_KEY" \
            "SPP_API_URL=http://localhost:3000" \
            "SPP_API_KEY=$SPP_API_KEY" \
            "SERPER_API_KEY=$SERPER" \
            "OPENROUTER_API_KEY=$OPENROUTER" \
          | ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "umask 077 && cat > '${{ secrets.VPS_APP_DIR }}/scraper/.env'"

          # Les extras du scraper, vides par défaut, et résolus **ici** plutôt
          # que sur le VPS : une variable du shell distant devrait être
          # échappée à travers les guillemets du ssh, et une erreur
          # d'échappement se découvrirait en production.
          #
          # Pourquoi une variable de dépôt plutôt qu'une ligne en dur : le
          # worker tourne dans ce venv et nulle part ailleurs, donc ce qui n'y
          # est pas installé n'existe pas pour lui — la console pouvait offrir
          # le fournisseur « gliner » sans que le worker sache le charger. Mais
          # l'extra tire torch, deux gigaoctets, et l'imposer à tous les
          # déploiements pour une expérience de banc serait un mauvais marché.
          # `SCRAPER_EXTRAS=gliner` l'active ; son absence ne change rien.
          EXTRAS='${{ vars.SCRAPER_EXTRAS }}'
          if [ -n "$EXTRAS" ]; then SPEC=".[$EXTRAS]"; else SPEC="."; fi

          # Torch en version **processeur**, posé avant l'extra qui le réclame.
          #
          # `pip install torch` sur Linux tire par défaut la variante CUDA :
          # torch lui-même, puis une demi-douzaine de paquets `nvidia-*` —
          # plusieurs gigaoctets, pour des noyaux GPU que ce VPS n'exécutera
          # jamais. C'est ce qui a fait déborder le déploiement, et le `df` du
          # disque n'en montrait rien parce que ce n'est pas là que ça
          # débordait. La roue CPU pèse environ deux cents mégaoctets et n'a
          # aucune dépendance nvidia.
          #
          # Posé **en premier** : l'extra trouve alors torch déjà satisfait et
          # ne va pas chercher la variante CUDA. L'ordre est le mécanisme, pas
          # une précaution.
          PRE=''
          case ",$EXTRAS," in
            *,gliner,*) PRE=".venv/bin/pip install --quiet --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch" ;;
          esac

          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            set -e
            cd '${{ secrets.VPS_APP_DIR }}/scraper'
            python3 -m venv .venv || {
              echo 'Le module venv de Python manque sur le VPS. En root :'
              echo '    apt install -y python3-venv'
              echo '(ou le paquet versionné que le message ci-dessus indique,'
              echo ' par exemple python3.14-venv)'
              exit 1
            }
            # pip déballe ses roues dans TMPDIR, et /tmp est un tmpfs sur ce
            # VPS : deux gigaoctets pris sur les quatre de RAM, où un déballage
            # de torch meurt sans que le disque bouge d'un pouce. /var/tmp est
            # sur le disque, et il y reste vingt-neuf gigaoctets.
            export TMPDIR='/var/tmp'
            .venv/bin/pip install --quiet --upgrade pip
            $PRE
            .venv/bin/pip install --quiet --no-cache-dir -e '$SPEC'
          "

      # Le worker exécute les recherches lancées depuis la console
      # d'administration. Tant qu'il n'est pas installé (voir deploy/README.md
      # § 9), le site reste livré : les exécutions attendent simplement en file.
      - name: Redémarrer le worker du scraper
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo systemctl restart sortiespourpetits-scraper' \
            || echo 'Worker non installé sur le VPS — voir deploy/README.md § 9.'

      # Le worker de l'agent, le second scraper. Même tolérance : tant qu'il
      # n'est pas installé, les exécutions « agent » attendent en file.
      - name: Redémarrer le worker de l'agent
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo systemctl restart sortiespourpetits-agent' \
            || echo "Worker de l'agent non installé sur le VPS — voir deploy/README.md § 9."
